name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest --cov=oscal_ssp_generator --cov-report=term-missing

      - name: Smoke-test the CLI
        run: |
          oscal-ssp-generator examples/terraform.tfstate -o /tmp/ssp.json --no-banner
          python -c "import json; d=json.load(open('/tmp/ssp.json')); assert d['system-security-plan']['metadata']['oscal-version'] == '1.1.2'"

  lint:
    name: Validate examples
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON examples parse
        run: |
          python -c "import json; json.load(open('examples/terraform.tfstate'))"
          python -c "import json; json.load(open('examples/aws_inventory.json'))"
