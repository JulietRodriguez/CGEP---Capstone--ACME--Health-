[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oscal-ssp-generator"
version = "0.1.0"
description = "Auto-generate draft OSCAL 1.1.2 System Security Plans from Terraform state or AWS resource inventories."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Juliet Rodriguez" }]
keywords = ["oscal", "ssp", "fedramp", "nist-800-53", "compliance", "aws", "terraform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = [
    "rich>=13.0",
    "streamlit>=1.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
oscal-ssp-generator = "oscal_ssp_generator.cli:main"

[project.urls]
Homepage = "https://github.com/JulietRodriguez/oscal-ssp-generator"
Issues = "https://github.com/JulietRodriguez/oscal-ssp-generator/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]
